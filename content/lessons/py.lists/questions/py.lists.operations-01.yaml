  rightId: remove-end
explanation:
- type: text
  text: append는 끝에 추가하고 pop은 끝 원소를 제거합니다. 대괄호 인덱싱은 원소를 읽습니다.
- type: text
  text: 리스트의 연산은 위치와 끝 중 어느 곳을 다루는지 함께 기억하면 구분하기 쉽습니다.
