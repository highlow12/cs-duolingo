- type: text
  text: 두 배는 같은 값을 두 번 더한 값이므로 +를 사용합니다.
- type: text
  text: 반환식은 함수 호출 결과가 되며, 호출자는 그 값을 다른 계산에 다시 쓸 수 있습니다.
