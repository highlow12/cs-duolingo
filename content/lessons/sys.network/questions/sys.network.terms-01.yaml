schemaVersion: 1
id: sys.network.terms-01
revision: 1
type: matching
prompt:
- type: text
  text: 네트워크 용어와 역할을 알맞게 연결하세요.
leftItems:
- id: ip
  content:
  - type: text
    text: IP 주소
- id: dns
  content:
  - type: text
    text: DNS
- id: port
  content:
  - type: text
    text: 포트
rightItems:
- id: location
  content:
  - type: text
    text: 네트워크에서 장치의 위치를 식별한다
- id: name-lookup
  content:
  - type: text
    text: 도메인 이름을 IP 주소로 찾는다
- id: process
