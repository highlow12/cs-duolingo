explanation:
- type: text
  text: IP는 장치 주소, DNS는 이름 조회, 포트는 장치 안의 통신 대상을 구분합니다.
- type: text
  text: 주소의 범위가 장치인지 프로그램인지 나누어 보면 세 용어를 헷갈리지 않습니다.
