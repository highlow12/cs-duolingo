schemaVersion: 1
id: algo.traversal.dfs-output-01
revision: 1
type: code-output
prompt:
- type: text
  text: 이웃 목록 순서를 따라 DFS를 실행할 때 출력 결과를 고르세요.
language: python
code: |-
  graph = {"A": ["B", "C"], "B": [], "C": []}
  seen = set()

  def dfs(node):
      print(node)
      seen.add(node)
      for nxt in graph[node]:
          if nxt not in seen:
              dfs(nxt)

  dfs("A")
choices:
- 'A

  B

  C'
- 'A

  C

  B'
- 'B

  A

  C'
acceptedOutputs:
- 'A

  B

  C'
explanation:
- type: text
  text: A를 방문한 뒤 이웃 목록의 B를 먼저 깊게 방문하고, 이어서 C를 방문합니다.
- type: text
  text: DFS의 실제 순서는 그래프의 이웃을 어떤 순서로 저장하고 순회하는지에 따라 달라집니다.
