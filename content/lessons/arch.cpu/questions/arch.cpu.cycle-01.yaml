- type: text
  text: CPU는 명령을 가져와 해석하고 실행한 뒤 결과를 기록합니다.
- type: text
  text: 구현에 따라 세부 단계가 더 나뉘어도 이 네 동작의 의존 순서는 유지됩니다.
