<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="짧은 설명과 반복 문제로 컴퓨터과학을 학습하는 Offline First 앱"
    />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CS 듀오링고" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link
      rel="icon"
      href="%sveltekit.assets%/icons/icon.svg"
      type="image/svg+xml"
    />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-code="viewport"
    data-sveltekit-preload-data="hover"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
